
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Hafidz Al Farizi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef1f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: #172b40;
        }

        /* Background dekorasi */
        .background-decoration {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: #dce5ef;
            filter: blur(2px);
            z-index: -1;
            top: -130px;
            right: -100px;
        }

        .background-decoration.bottom {
            top: auto;
            right: auto;
            bottom: -160px;
            left: -100px;
        }

        /* Kartu profil */
        .profile-card {
            width: 100%;
            max-width: 850px;
            min-height: 390px;
            background: #ffffff;
            border-radius: 22px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(20, 43, 64, 0.12);
            animation: appear 0.8s ease;
            position: relative;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Bagian logo */
        .profile-logo {
            width: 32%;
            background: #172e46;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .profile-logo::before {
            content: "";
            position: absolute;
            width: 230px;
            height: 230px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
        }

        .profile-logo::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 50%;
        }

        .logo-circle {
            width: 145px;
            height: 145px;
            border: 2px solid rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            transition: 0.4s;
        }

        .logo-circle:hover {
            transform: rotate(-8deg) scale(1.08);
        }

        .logo-circle span {
            color: white;
            font-size: 85px;
            font-weight: 800;
            font-style: italic;
        }

        /* Bagian informasi */
        .profile-info {
            flex: 1;
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .name {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.7px;
            color: #172e46;
            line-height: 1.3;
        }

        .nickname {
            font-size: 12px;
            letter-spacing: 7px;
            color: #718296;
            margin-top: 5px;
            font-weight: 600;
        }

        .line {
            height: 2px;
            width: 100%;
            background: #dce3ea;
            margin: 22px 0;
        }

        /* Detail informasi */
        .detail {
            display: grid;
            grid-template-columns: 27px 115px 12px 1fr;
            align-items: start;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.5;
        }

        .detail-icon {
            width: 20px;
            height: 20px;
            color: #233f5b;
        }

        .detail-label {
            font-weight: 700;
            color: #526477;
        }

        .detail-separator {
            color: #526477;
            font-weight: bold;
        }

        .detail-value {
            color: #172e46;
            font-weight: 600;
        }

        /* Status */
        .status {
            display: inline-block;
            background: #e9f0f7;
            color: #244b70;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            width: fit-content;
        }

        /* Tombol */
        .copy-button {
            margin-top: 14px;
            padding: 10px 17px;
            border: none;
            background: #172e46;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
            width: fit-content;
        }

        .copy-button:hover {
            background: #294c6e;
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #172e46;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 15px;
            right: 40px;
            font-size: 10px;
            color: #9aa7b5;
            letter-spacing: 1px;
        }

        /* Responsive HP */
        @media (max-width: 650px) {
            body {
                padding: 18px;
            }

            .profile-card {
                flex-direction: column;
                max-width: 420px;
            }

            .profile-logo {
                width: 100%;
                height: 170px;
            }

            .logo-circle {
                width: 110px;
                height: 110px;
            }

            .logo-circle span {
                font-size: 65px;
            }

            .profile-info {
                padding: 30px 23px 45px;
            }

            .name {
                font-size: 22px;
            }

            .detail {
                grid-template-columns: 23px 95px 8px 1fr;
                gap: 5px;
                font-size: 12px;
            }

            .footer {
                right: 20px;
                bottom: 15px;
            }
        }

        @media (max-width: 360px) {
            .detail {
                grid-template-columns: 20px 82px 6px 1fr;
                font-size: 11px;
                gap: 4px;
            }

            .name {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="background-decoration"></div>
    <div class="background-decoration bottom"></div>

    <main class="profile-card">

        <!-- LOGO -->
        <section class="profile-logo">
            <div class="logo-circle">
                <span>H</span>
            </div>
        </section>

        <!-- INFORMASI PROFIL -->
        <section class="profile-info">

            <h1 class="name">
                HAFIDZ AL FARIZI NURWIDEV
            </h1>

            <p class="nickname">H A F I D Z</p>

            <div class="line"></div>

            <!-- NIM -->
            <div class="detail">
                <svg class="detail-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm-6 10.18v4L12 21l6-3.82v-4L12 16.5l-6-3.32z"/>
                </svg>
                <span class="detail-label">NIM</span>
                <span class="detail-separator">:</span>
                <span class="detail-value">025241461179</span>
            </div>

            <!-- PRODI -->
            <div class="detail">
                <svg class="detail-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3L1 8l11 5 9-4.09V16h2V8L12 3zM5 11.18V17l7 4 7-4v-5.82l-7 3.18-7-3.18z"/>
                </svg>
                <span class="detail-label">PRODI/KELAS</span>
                <span class="detail-separator">:</span>
                <span class="detail-value">MANAJEMEN INFORMASI (MI-B)</span>
            </div>

            <!-- UNIVERSITAS -->
            <div class="detail">
                <svg class="detail-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3L1 8v2h22V8L12 3zM4 12v7H2v2h20v-2h-2v-7h-3v7h-3v-7h-4v7H7v-7H4z"/>
                </svg>
                <span class="detail-label">UNIVERSITAS</span>
                <span class="detail-separator">:</span>
                <span class="detail-value">
                    SEKOLAH TINGGI MULTI MEDIA (MMTC) YOGYAKARTA
                </span>
            </div>

            <!-- DOMISILI -->
            <div class="detail">
                <svg class="detail-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3L2 12h3v9h6v-6h2v6h6v-9h3L12 3z"/>
                </svg>
                <span class="detail-label">DOMISILI</span>
                <span class="detail-separator">:</span>
                <span class="detail-value">CIAMIS - YOGYAKARTA</span>
            </div>

            <!-- STATUS -->
            <div class="detail">
                <svg class="detail-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z"/>
                </svg>
                <span class="detail-label">STATUS</span>
                <span class="detail-separator">:</span>
                <span class="detail-value">
                    <span class="status">MAHASISWA</span>
                </span>
            </div>

            <!-- TOMBOL SALIN -->
            <button class="copy-button" onclick="copyNIM()">
                Salin NIM
            </button>

        </section>

        <div class="footer">
            PERSONAL PROFILE • 2026
        </div>

    </main>

    <div class="toast" id="toast">
        NIM berhasil disalin!
    </div>

    <script>
        function copyNIM() {
            const nim = "025241461179";
            const toast = document.getElementById("toast");

            navigator.clipboard.writeText(nim)
                .then(() => {
                    toast.textContent = "NIM berhasil disalin!";
                    toast.classList.add("show");

                    setTimeout(() => {
                        toast.classList.remove("show");
                    }, 2000);
                })
                .catch(() => {
                    toast.textContent = "Gagal menyalin NIM.";
                    toast.classList.add("show");

                    setTimeout(() => {
                        toast.classList.remove("show");
                    }, 2000);
                });
        }
    </script>

</body>
</html>
